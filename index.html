h1, h2, h3, p, figure, dl, dd { margin: 0; }
a { color: inherit; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }

.wrap {

.panel { width: 100%; max-width: 560px; margin-block: auto; background: var(--surface); color: var(--ink); border: 1px solid var(--line); border-radius: 6px; padding: 24px; }

.hint { font-size: .85rem; color: var(--muted); }

.fstat { color: var(--muted); margin-bottom: 12px; }
.frow { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 10px; }

.toast { position: fixed; z-index: 60; left: 50%; transform: translateX(-50%); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); max-width: calc(100% - 32px); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 4px; font-weight: 600; text-align: center; }

  .hero-in, .about { grid-template-columns: minmax(0, 1fr); }
  .sec { padding-block: 32px; }
  .panel { padding: 20px; }
}
@media (prefers-reduced-motion: reduce) {

      else form.appendChild(h('div', { class: 'fld' }, h('label', { for: id, text: f.label + (f.required ? ' *' : '') }), input, f.hint ? h('p', { class: 'hint', text: f.hint }) : null));
    });
    var cancel = h('button', { class: 'btn', type: 'button', text: 'Annulla', onclick: function () { if (!busy) close(); } });
    var submit = h('button', { class: 'btn btn-primary', type: 'submit', text: cfg.submit });
    form.appendChild(err);
    form.appendChild(stat);
    form.appendChild(h('div', { class: 'frow' }, cancel, submit));
    overlay.appendChild(form);

    function close() {
      overlay.remove();
      if (prev && prev.focus) prev.focus();
    }
    function showErr(m) { err.textContent = m; err.hidden = false; }
    function setBusy(b, m) {
      busy = b;
      submit.disabled = b; cancel.disabled = b;
      err.hidden = true;
      stat.hidden = !m; stat.textContent = m || '';
    }
    overlay.addEventListener('keydown', function (e) { if (e.key === 'Escape' && !busy) close(); });
    overlay.addEventListener('mousedown', function (e) { if (e.target === overlay && !busy) close(); });
    form.addEventListener('submit', function (ev) {
      ev.preventDefault();
      if (busy) return;
      var vals = {};
      for (var i = 0; i < cfg.fields.length; i++) {
        var f = cfg.fields[i], el = els[f.id];
        if (f.type === 'file') {
          vals[f.id] = Array.prototype.slice.call(el.files || []);
          if (f.required && !vals[f.id].length) { showErr('Scegli almeno una foto.'); return; }
        } else if (f.type === 'check') {
          vals[f.id] = el.checked;
        } else {
          var v = el.value.trim();
          if (f.required && !v) { el.focus(); showErr('Compila il campo «' + f.label + '».'); return; }
          vals[f.id] = v;
        }
      }
      setBusy(true, 'Pubblicazione in corso…');
      var p;
      try { p = cfg.onSubmit(vals, function (m) { stat.hidden = false; stat.textContent = m; }); } catch (e) { p = Promise.reject(e); }
      p.then(function () {
        stat.hidden = false; stat.textContent = 'Pubblicato. La pagina si aggiorna…';
      }, function (e) {
        setBusy(false);
        showErr(failMsg(e));
        lostPermission(e);
      });
    });

    var first = form.querySelector('input,textarea');
    if (first) first.focus();

  /* ---------- esportazione per GitHub ---------- */
  var crcTable = null;
  function crc32(u8) {
    if (!crcTable) {
      crcTable = new Uint32Array(256);
      for (var n = 0; n < 256; n++) {
        var c = n;
        for (var k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
        crcTable[n] = c >>> 0;
      }
    }
    var crc = 0xFFFFFFFF;
    for (var i = 0; i < u8.length; i++) crc = crcTable[(crc ^ u8[i]) & 0xFF] ^ (crc >>> 8);
    return (crc ^ 0xFFFFFFFF) >>> 0;
  }
  function makeZip(files) {
    var enc = new TextEncoder();
    var parts = [], central = [], offset = 0, cdSize = 0;
    files.forEach(function (f) {
      var name = enc.encode(f.name), crc = crc32(f.data), size = f.data.length;
      var lh = new DataView(new ArrayBuffer(30));
      lh.setUint32(0, 0x04034b50, true); lh.setUint16(4, 20, true); lh.setUint16(6, 0x0800, true);
      lh.setUint16(8, 0, true); lh.setUint16(10, 0, true); lh.setUint16(12, 0x21, true);
      lh.setUint32(14, crc, true); lh.setUint32(18, size, true); lh.setUint32(22, size, true);
      lh.setUint16(26, name.length, true); lh.setUint16(28, 0, true);
      parts.push(lh.buffer, name, f.data);
      var ch = new DataView(new ArrayBuffer(46));
      ch.setUint32(0, 0x02014b50, true); ch.setUint16(4, 20, true); ch.setUint16(6, 20, true); ch.setUint16(8, 0x0800, true);
      ch.setUint16(10, 0, true); ch.setUint16(12, 0, true); ch.setUint16(14, 0x21, true);
      ch.setUint32(16, crc, true); ch.setUint32(20, size, true); ch.setUint32(24, size, true);
      ch.setUint16(28, name.length, true); ch.setUint32(42, offset, true);
      central.push(ch.buffer, name);
      cdSize += 46 + name.length;
      offset += 30 + name.length + size;
    });
    var end = new DataView(new ArrayBuffer(22));
    end.setUint32(0, 0x06054b50, true);
    end.setUint16(8, files.length, true); end.setUint16(10, files.length, true);
    end.setUint32(12, cdSize, true); end.setUint32(16, offset, true);
    return new Blob(parts.concat(central, [end.buffer]), { type: 'application/zip' });
  }
  function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }

  function viaCanvas(id) {
    return new Promise(function (res, rej) {
      var img = new Image();
      img.onload = function () {
        var c = document.createElement('canvas');
        c.width = img.naturalWidth; c.height = img.naturalHeight;
        c.getContext('2d').drawImage(img, 0, 0);
        c.toBlob(function (b) {
          if (!b) { rej(new Error('Non riesco a leggere una delle foto.')); return; }
          b.arrayBuffer().then(function (ab) { res(new Uint8Array(ab)); }, rej);
        }, 'image/jpeg', 0.92);
      };
      img.onerror = function () { rej(new Error('Non riesco a leggere una delle foto.')); };
      img.src = imgSrc(id);
    });
  }
  function getBytes(id) {
    return fetch(imgSrc(id))
      .then(function (r) { if (!r.ok) throw new Error('http'); return r.arrayBuffer(); })
      .then(function (b) { return new Uint8Array(b); })
      .catch(function () { return viaCanvas(id); });
  }

  function exportSite(setStatus) {
    var ids = [];
    S.photos.concat(S.events, S.news).forEach(function (x) { if (x.img && ids.indexOf(x.img) < 0) ids.push(x.img); });
    var enc = new TextEncoder();
    var files = [

  }

  function headerEl() {
    return h('header', { class: 'top' }, h('div', { class: 'wrap top-in' },
      h('a', { class: 'brand', href: '#inizio', text: S.assoc.name || TITLE }),
      h('nav', { class: 'nav', 'aria-label': 'Sezioni del sito' },
        h('a', { href: '#eventi', text: 'Eventi' }),
        h('a', { href: '#news', text: 'News' }),
        h('a', { href: '#foto', text: 'Foto' }),
        h('a', { href: '#chi-siamo', text: 'Chi siamo' }))));
  }

  function heroEl() {
    var next = upcoming()[0];
    var left = h('div', {},
      h('h1', { text: S.assoc.name || TITLE }),
      S.assoc.tagline ? h('p', { class: 'lead', text: S.assoc.tagline }) : null,
      h('p', { class: 'sos' }, h('strong', { text: 'In caso di emergenza chiama il 112.' }), ' Questo sito racconta le attività dell’associazione e non è un servizio di soccorso.'));
    var right = next ? h('div', { class: 'teaser' },
      h('p', { class: 'label', text: 'Prossimo appuntamento' }),
      h('h2', {}, next.title, badge(next)),
      h('p', { class: 'meta', text: fmtLong(next.date) + (next.time ? ' · ore ' + next.time : '') }),
      next.place ? h('p', { class: 'meta' }, h('span', { class: 'k', text: 'Dove' }), next.place) : null,
      h('a', { class: 'more', href: '#eventi', text: 'Tutti gli eventi' })) : null;
    return h('section', { class: 'hero', id: 'inizio' }, h('div', { class: 'wrap hero-in' + (right ? '' : ' solo') }, left, right));
  }

  function eventsEl() {
    var up = upcoming(), past = pastEvents();
    var wrap = h('div', { class: 'wrap' }, sectionHead('Eventi', 'Aggiungi evento', function () { eventForm(null); }));
    if (up.length) wrap.appendChild(h('div', { class: 'grid' }, up.map(function (e) { return eventCard(e, false); })));
    else wrap.appendChild(h('p', { class: 'empty', text: canEdit ? 'Nessun evento in programma. Usa «Aggiungi evento» per pubblicare il primo.' : 'Nessun evento in programma al momento. Torna a trovarci presto.' }));
    if (past.length) {
      wrap.appendChild(h('h3', { class: 'sub', text: 'Eventi passati' }));
      wrap.appendChild(h('div', { class: 'grid' }, past.slice(0, 6).map(function (e) { return eventCard(e, true); })));
    }
    return h('section', { class: 'sec', id: 'eventi' }, wrap);
  }

  function newsEl() {
    var list = S.news.slice().sort(function (a, b) { return b.date.localeCompare(a.date); });
    var wrap = h('div', { class: 'wrap' }, sectionHead('News', 'Aggiungi notizia', function () { newsForm(null); }));
    if (list.length) wrap.appendChild(h('div', { class: 'grid' }, list.map(newsCard)));
    else wrap.appendChild(h('p', { class: 'empty', text: canEdit ? 'Nessuna notizia. Usa «Aggiungi notizia» per pubblicare la prima.' : 'Nessuna notizia pubblicata per ora.' }));
    return h('section', { class: 'sec', id: 'news' }, wrap);
  }

  function photosEl() {
    var wrap = h('div', { class: 'wrap' }, sectionHead('Foto', 'Aggiungi foto', assetsNs ? photoForm : null));
    var list = S.photos;
    if (list.length) {
      var shown = showAll ? list : list.slice(0, MAX_SHOWN);
      wrap.appendChild(h('div', { class: 'gal' }, shown.map(function (p, i) { return photoTile(p, i); })));
      if (list.length > MAX_SHOWN) {
        wrap.appendChild(h('div', { class: 'acts' }, h('button', { class: 'btn', type: 'button', text: showAll ? 'Mostra meno foto' : 'Mostra tutte le ' + list.length + ' foto', onclick: function () { showAll = !showAll; render(); } })));
      }
    } else {
      wrap.appendChild(h('p', { class: 'empty', text: canEdit ? 'Nessuna foto. Usa «Aggiungi foto» per caricare le prime immagini.' : 'Le fotografie dell’associazione saranno pubblicate qui.' }));
    }
    return h('section', { class: 'sec', id: 'foto' }, wrap);
  }

  function contactRow(label, val) {
    return h('div', { class: 'crow' },
      h('dt', { text: label }),
      h('dd', {}, h('span', { class: 'cval', text: val }),
        h('button', { class: 'btn btn-sm', type: 'button', text: 'Copia', onclick: function () { copyText(val); } })));
  }

  function aboutEl() {
    var a = S.assoc;
    var wrap = h('div', { class: 'wrap' }, sectionHead('Chi siamo', 'Modifica informazioni', infoForm));
    var text = paragraphs(a.about);
    var rows = [];
    if (a.sede) rows.push(contactRow('Sede', a.sede));
    if (a.email) rows.push(contactRow('Email', a.email));
    if (a.tel) rows.push(contactRow('Telefono', a.tel));
    wrap.appendChild(h('div', { class: 'about' },
      h('div', {}, text.length ? text : h('p', { class: 'empty', text: canEdit ? 'Scrivi la presentazione dell’associazione con «Modifica informazioni».' : 'La presentazione dell’associazione sarà pubblicata presto.' })),
      rows.length ? h('dl', { class: 'contacts' }, rows) : null));
    return h('section', { class: 'sec', id: 'chi-siamo' }, wrap);
  }

  function footerEl() {
    return h('footer', { class: 'foot' }, h('div', { class: 'wrap' },
      h('p', { text: S.assoc.name || TITLE }),
      h('p', { text: 'Emergenze: 112' })));
  }

  function adminBar() {
    var hasDemo = S.events.concat(S.news).some(function (x) { return x.demo; });
    return h('div', { class: 'adminbar' }, h('div', { class: 'wrap' },
      h('strong', { text: 'Modalità gestione' }),
      h('span', { text: 'Puoi aggiungere, modificare ed eliminare eventi, notizie e foto. Chi visita il sito vede solo il risultato.' }),
      hasDemo ? h('span', { text: 'Gli elementi con l’etichetta «Esempio» sono segnaposto: modificali o eliminali.' }) : null,
      h('div', { class: 'acts' },
        h('button', { class: 'btn btn-sm', type: 'button', text: 'Modifica nome e informazioni', onclick: infoForm }),
        h('button', { class: 'btn btn-sm', type: 'button', text: 'Scarica per GitHub', onclick: exportPanel }))));
  }

  function render() {
    var y = window.scrollY || 0;
    app.textContent = '';
    app.appendChild(h('div', { class: 'tape', 'aria-hidden': 'true' }));
    if (canEdit) app.appendChild(adminBar());
    app.appendChild(headerEl());
    app.appendChild(heroEl());
    app.appendChild(eventsEl());
    app.appendChild(newsEl());
    app.appendChild(photosEl());
    app.appendChild(aboutEl());
    app.appendChild(footerEl());
    app.appendChild(h('div', { class: 'tape', 'aria-hidden': 'true' }));
    window.scrollTo(0, y);
  }

  render();

  (async function () {
    try {
      var c = window.claude;
      if (!c || !c.use) return;
      var u = await c.use('user');
      var ok = u ? await u.canEdit() : false;
      if (!ok) return;
      artifactNs = await c.use('artifact');
      if (!artifactNs) return;
      assetsNs = await c.use('assets');
      downloadsNs = await c.use('downloads');
      canEdit = true;
      render();
    } catch (e) { /* resta la vista pubblica */ }
  })();
})();
</script></body></html>
